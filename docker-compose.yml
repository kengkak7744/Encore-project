services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: artist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artist}
      POSTGRES_DB: artist_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artist -d artist_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://artist:artist@db:5432/artist_tracker}
      WEB_ORIGIN: http://localhost:3000
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_RESOURCE_ID: ${OLLAMA_RESOURCE_ID:-encore-local-gpu}
      OLLAMA_BACKGROUND_QUIET_SECONDS: ${OLLAMA_BACKGROUND_QUIET_SECONDS:-15}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_MONTHLY_LIMIT_THB: ${X_MONTHLY_LIMIT_THB:-350}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      BANDSINTOWN_APP_ID: ${BANDSINTOWN_APP_ID:-}
      AGODA_ENABLED: ${AGODA_ENABLED:-false}
      AGODA_CLIENT_ID: ${AGODA_CLIENT_ID:-}
      AGODA_CLIENT_SECRET: ${AGODA_CLIENT_SECRET:-}
      AGODA_TOKEN_URL: ${AGODA_TOKEN_URL:-}
      AGODA_SEARCH_URL: ${AGODA_SEARCH_URL:-}
      AGODA_ENV: ${AGODA_ENV:-sandbox}
      AGODA_PROPERTY_IDS_JSON: '${AGODA_PROPERTY_IDS_JSON:-{}}'
      SOCIAL_STALE_AFTER_MINUTES: ${SOCIAL_STALE_AFTER_MINUTES:-60}
      GOOGLE_ROUTES_ENABLED: ${GOOGLE_ROUTES_ENABLED:-false}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_ROUTES_TIMEOUT_SECONDS: ${GOOGLE_ROUTES_TIMEOUT_SECONDS:-5}
      GOOGLE_MAPS_EMBED_API_KEY: ${GOOGLE_MAPS_EMBED_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAPS_DAILY_REQUEST_LIMIT: ${GOOGLE_MAPS_DAILY_REQUEST_LIMIT:-100}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["npm", "run", "start:worker", "-w", "@artist-tracker/server"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://artist:artist@db:5432/artist_tracker}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_RESOURCE_ID: ${OLLAMA_RESOURCE_ID:-encore-local-gpu}
      OLLAMA_BACKGROUND_QUIET_SECONDS: ${OLLAMA_BACKGROUND_QUIET_SECONDS:-15}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_MONTHLY_LIMIT_THB: ${X_MONTHLY_LIMIT_THB:-350}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      TICKETMASTER_BASE_URL: ${TICKETMASTER_BASE_URL:-https://app.ticketmaster.com/discovery/v2}
      TICKETMASTER_COUNTRY_CODE: ${TICKETMASTER_COUNTRY_CODE:-TH}
      TICKETMASTER_TIMEOUT_SECONDS: ${TICKETMASTER_TIMEOUT_SECONDS:-10}
      CONCERT_SCHEDULER_ENABLED: ${CONCERT_SCHEDULER_ENABLED:-true}
      CONCERT_LOCAL_RESEARCH_ENABLED: ${CONCERT_LOCAL_RESEARCH_ENABLED:-false}
      CONCERT_REUSE_AUTHORIZED_SOURCES: ${CONCERT_REUSE_AUTHORIZED_SOURCES:-}
      CONCERT_DETAIL_LIMIT: ${CONCERT_DETAIL_LIMIT:-200}
      CONCERT_REPORT_DIRECTORY: /app/reports
      INSTAGRAM_GRAPH_ACCESS_TOKEN: ${INSTAGRAM_GRAPH_ACCESS_TOKEN:-}
      INSTAGRAM_GRAPH_IG_USER_ID: ${INSTAGRAM_GRAPH_IG_USER_ID:-}
      INSTAGRAM_GRAPH_TOKEN_EXPIRES_AT: ${INSTAGRAM_GRAPH_TOKEN_EXPIRES_AT:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v25.0}
      SOCIAL_SCHEDULER_ENABLED: ${SOCIAL_SCHEDULER_ENABLED:-true}
      SOCIAL_SYNC_INTERVAL_MINUTES: ${SOCIAL_SYNC_INTERVAL_MINUTES:-60}
      INSTAGRAM_REQUEST_SPACING_SECONDS: ${INSTAGRAM_REQUEST_SPACING_SECONDS:-60}
      INSTAGRAM_ADAPTIVE_PACING_ENABLED: ${INSTAGRAM_ADAPTIVE_PACING_ENABLED:-true}
      INSTAGRAM_MIN_SPACING_SECONDS: ${INSTAGRAM_MIN_SPACING_SECONDS:-30}
      INSTAGRAM_CHECK_INTERVAL_MINUTES: ${INSTAGRAM_CHECK_INTERVAL_MINUTES:-45}
      INSTAGRAM_PROBE_LIMIT: ${INSTAGRAM_PROBE_LIMIT:-5}
      INSTAGRAM_DETAIL_MAX_USAGE_PERCENT: ${INSTAGRAM_DETAIL_MAX_USAGE_PERCENT:-60}
      INSTAGRAM_MEDIA_MAX_USAGE_PERCENT: ${INSTAGRAM_MEDIA_MAX_USAGE_PERCENT:-40}
      INSTAGRAM_MEDIA_REFRESH_HOURS: ${INSTAGRAM_MEDIA_REFRESH_HOURS:-6}
      INSTAGRAM_USAGE_PAUSE_PERCENT: ${INSTAGRAM_USAGE_PAUSE_PERCENT:-75}
      INSTAGRAM_RATE_LIMIT_COOLDOWN_MINUTES: ${INSTAGRAM_RATE_LIMIT_COOLDOWN_MINUTES:-60}
      BANDSINTOWN_APP_ID: ${BANDSINTOWN_APP_ID:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.local/concert-reports:/app/reports
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ORIGIN: http://api:4000
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:3000"
  biography-worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "apps/server/dist/biography-worker.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://artist:artist@db:5432/artist_tracker}
      OLLAMA_RESOURCE_ID: ${OLLAMA_RESOURCE_ID:-encore-local-gpu}
      OLLAMA_BACKGROUND_QUIET_SECONDS: ${OLLAMA_BACKGROUND_QUIET_SECONDS:-15}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      BIOGRAPHY_OLLAMA_URL: http://host.docker.internal:11434
      BIOGRAPHY_MODEL: ${BIOGRAPHY_MODEL:-encore-biography:qwen3.8-27b}
      BIOGRAPHY_ENABLED: ${BIOGRAPHY_ENABLED:-true}
      BIOGRAPHY_WINDOW_START: ${BIOGRAPHY_WINDOW_START:-23:00}
      BIOGRAPHY_WINDOW_END: ${BIOGRAPHY_WINDOW_END:-00:00}
      BIOGRAPHY_MAX_PER_NIGHT: ${BIOGRAPHY_MAX_PER_NIGHT:-10}
      BIOGRAPHY_TIMEOUT_SECONDS: ${BIOGRAPHY_TIMEOUT_SECONDS:-240}
    depends_on:
      db:
        condition: service_healthy
  seed:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "apps/server/dist/seed.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://artist:artist@db:5432/artist_tracker}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
